packages:
  - 'packages/*'

# Single source of truth for dependencies shared across packages.
# Reference these in a package.json with "<dep>": "catalog:".
catalog:
  '@eslint/js': ^9.10.0
  '@types/node': ^22.15.21
  '@vitest/coverage-v8': ^4.1.7
  '@zxcvbn-ts/core': ^3.0.4
  eslint: ^9.10.0
  type-fest: ^5.6.0
  typescript: ^5.9.3
  vitest: ^4.1.7
  ws: ^8.20.1

# wtfconfig, wtf-devconfigs and jpake-ts are first-party packages, published and
# consumed straight away. pnpm 11 quarantines releases younger than a day, which
# the container's global pnpm rc already waives for the first two -- `nix build`
# cannot see that file, and it does not name jpake-ts at all, so the waiver has
# to live here or the deps fetch fails.
minimumReleaseAgeExclude:
  - wtfconfig
  - wtf-devconfigs
  - jpake-ts

# pnpm 11 verifies node_modules before `pnpm exec`, and when it decides the
# directory has to be recreated it asks first -- which fails outright with
# ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY wherever there is no TTY. Every
# Makefile target runs through `pnpm exec`, so let it purge unattended.
confirmModulesPurge: false

allowBuilds:
  bufferutil: true
  canvas: true
  esbuild: true
  keytar: true
