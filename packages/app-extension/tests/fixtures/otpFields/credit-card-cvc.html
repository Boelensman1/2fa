<form aria-label="Payment details">
  <input name="card_number" autocomplete="cc-number" maxlength="19">
  <input name="expiry" autocomplete="cc-exp" maxlength="5">
  <input name="card_verification" maxlength="3" inputmode="numeric">
  <input name="postcode" autocomplete="postal-code" maxlength="6">
  <button type="submit">Pay</button>
</form>
